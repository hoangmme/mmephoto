<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MME Slot & Frame Visual Calibration Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(20, 26, 42, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-pink: #f43f5e;
      --accent-purple: #a855f7;
      --accent-green: #10b981;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 60px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }
    .brand span { color: var(--accent); }
    .controls-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select, button, input[type="text"], input[type="number"] {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    select:focus, button:hover, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }
    button.btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    button.btn-save {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    button.btn-save:hover, button.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .main-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .canvas-viewport {
      flex: 1;
      background: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }
    .view-toolbar {
      position: absolute;
      top: 16px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
      font-size: 13px;
    }
    .canvas-container {
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      border-radius: 4px;
      background: #ffffff;
      max-width: 100%;
      max-height: calc(100vh - 120px);
      object-fit: contain;
    }
    .sidebar {
      width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .slot-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slot-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      transition: all 0.2s;
    }
    .slot-card.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }
    .slot-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
    }
    .badge-index {
      background: var(--accent);
      color: #000;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .field-group label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .field-group input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 5px 8px;
    }
    .slot-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .json-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .json-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 800px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    textarea {
      flex: 1;
      min-height: 380px;
      background: #020617;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#38bdf8" stroke-width="2"/><path d="M12 6v12M6 12h12" stroke="#f43f5e" stroke-width="2"/></svg>
      MME Slot Editor <span>Visual Calibration</span>
    </div>
    <div class="controls-top">
      <label>Template:</label>
      <select id="selTemplate"></select>
      <button id="btnAddSlot" class="btn-sm">+ Thêm Slot</button>
      <button id="btnSaveDirect" class="btn-save">💾 LƯU TRỰC TIẾP VÀO CODE</button>
      <button id="btnExportJSON" class="btn-primary">📋 Copy JSON</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="canvas-viewport" id="viewport">
      <div class="view-toolbar">
        <label style="display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" id="chkShowPNG" checked> Lớp PNG Frame
        </label>
        <label style="display: flex; align-items: center; gap: 6px;">
          PNG Opacity:
          <input type="range" id="rngOpacity" min="0" max="1" step="0.05" value="1" style="width: 80px;">
          <span id="txtOpacity">100%</span>
        </label>
        <label style="display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" id="chkShowMask" checked> Hiển thị ClipPath Mask
        </label>
        <label style="display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" id="chkDemoPhotos"> Nạp Ảnh Demo Tất Cả
        </label>
      </div>

      <div class="canvas-container">
        <canvas id="editorCanvas"></canvas>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <span>Danh sách Slots (Thứ Tự Vẽ: Trên → Dưới)</span>
      </div>
      <div class="slot-list" id="slotList"></div>
    </div>
  </div>

  <div class="json-modal" id="jsonModal">
    <div class="json-box">
      <div style="padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);">
        <h3>Mã Cấu Hình JSON Cho pl-globals.js</h3>
        <button id="btnCloseModal" class="btn-sm">Đóng</button>
      </div>
      <textarea id="jsonOutput" readonly></textarea>
      <div style="padding: 14px 18px; text-align: right;">
        <button id="btnCopyJSON" class="btn-primary">Sao Chép Vào Clipboard</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { ALL_TEMPLATES } from './js/modules/pl-globals.js?v=287';
    import { CanvasRenderer } from './js/components/CanvasRenderer.js?v=287';

    let currentTmplId = 'a5-1';
    let currentSlots = [];
    let selectedSlotIdx = 0;
    let isDragging = false;
    let dragStartPos = { x: 0, y: 0 };
    let initialSlotPos = { cx: 0, cy: 0, w: 0, h: 0 };
    let frameImgObj = null;
    let demoImageMap = {};
    let slotPhotoTickedState = {};

    const selTemplate = document.getElementById('selTemplate');
    const slotList = document.getElementById('slotList');
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    const chkShowPNG = document.getElementById('chkShowPNG');
    const rngOpacity = document.getElementById('rngOpacity');
    const txtOpacity = document.getElementById('txtOpacity');
    const chkShowMask = document.getElementById('chkShowMask');
    const chkDemoPhotos = document.getElementById('chkDemoPhotos');
    const btnSaveDirect = document.getElementById('btnSaveDirect');

    // Populate dropdown
    Object.keys(ALL_TEMPLATES).forEach(id => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = `${ALL_TEMPLATES[id].name} (${id})`;
      selTemplate.appendChild(opt);
    });

    // Helper: Create instant dataURL test image with vibrant patterns & clear label
    function createInstantTestPhoto(bgColor, labelText) {
      const pc = document.createElement('canvas');
      pc.width = 1200; pc.height = 1200;
      const pctx = pc.getContext('2d');
      
      // Gradient background
      const grad = pctx.createLinearGradient(0, 0, 1200, 1200);
      grad.addColorStop(0, bgColor);
      grad.addColorStop(1, '#090d16');
      pctx.fillStyle = grad;
      pctx.fillRect(0, 0, 1200, 1200);

      // Inner portrait border simulation
      pctx.strokeStyle = '#ffffff';
      pctx.lineWidth = 16;
      pctx.strokeRect(60, 60, 1080, 1080);

      // Text label
      pctx.fillStyle = '#ffffff';
      pctx.font = 'bold 80px Inter, sans-serif';
      pctx.textAlign = 'center';
      pctx.textBaseline = 'middle';
      pctx.fillText(labelText, 600, 600);

      const img = new Image();
      img.src = pc.toDataURL('image/png');
      return img;
    }

    // Pre-create instant test images (Zero network delay, 100% reliable)
    const testImgRed = createInstantTestPhoto('#e11d48', 'TEST PHOTO 1');
    const testImgGreen = createInstantTestPhoto('#059669', 'TEST PHOTO 2');
    const testImgBlue = createInstantTestPhoto('#2563eb', 'TEST PHOTO 3');
    const testImgPurple = createInstantTestPhoto('#9333ea', 'TEST PHOTO 4');

    demoImageMap = {
      'test_img_0': testImgRed,
      'test_img_1': testImgGreen,
      'test_img_2': testImgBlue,
      'test_img_3': testImgPurple
    };

    // Load local test_photo.jpg (Downloaded to local disk for 100% fast & reliable loading)
    const testLocalImg = new Image();
    testLocalImg.src = './templates/test_photo.jpg';
    testLocalImg.onload = () => {
      demoImageMap['test_local_photo'] = testLocalImg;
      renderCanvas();
    };

    async function loadTemplate(tmplId) {
      currentTmplId = tmplId;
      const tmpl = ALL_TEMPLATES[tmplId];
      currentSlots = JSON.parse(JSON.stringify(tmpl.slots || []));
      selectedSlotIdx = 0;
      slotPhotoTickedState = {};

      frameImgObj = new Image();
      frameImgObj.src = tmpl.frame_url;
      await new Promise(r => frameImgObj.onload = r);

      renderSidebar();
      renderCanvas();
    }

    function renderSidebar() {
      slotList.innerHTML = '';
      currentSlots.forEach((slot, idx) => {
        const card = document.createElement('div');
        card.className = `slot-card ${idx === selectedSlotIdx ? 'active' : ''}`;
        card.onclick = (e) => {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !e.target.classList.contains('chk-slot-photo')) {
            selectedSlotIdx = idx;
            renderSidebar();
            renderCanvas();
          }
        };

        const hasClip = !!slot.clipPath;
        const slotKey = slot.id || ('slot_' + idx);
        const isTicked = !!slotPhotoTickedState[slotKey];

        card.innerHTML = `
          <div class="slot-card-header">
            <span><span class="badge-index">${idx + 1}</span> ${slotKey}</span>
            <span style="font-size: 11px; color: ${hasClip ? '#38bdf8' : '#94a3b8'};">${hasClip ? '★ ClipPath Mask' : 'Rect Slot'}</span>
          </div>
          <div class="grid-2x2">
            <div class="field-group"><label>CX (X Center)</label><input type="number" value="${slot.cx}" data-key="cx" data-idx="${idx}"></div>
            <div class="field-group"><label>CY (Y Center)</label><input type="number" value="${slot.cy}" data-key="cy" data-idx="${idx}"></div>
            <div class="field-group"><label>Width (W)</label><input type="number" value="${slot.w}" data-key="w" data-idx="${idx}"></div>
            <div class="field-group"><label>Height (H)</label><input type="number" value="${slot.h}" data-key="h" data-idx="${idx}"></div>
          </div>
          <div style="margin-bottom: 8px;">
            <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #38bdf8; font-weight: 600; cursor: pointer;">
              <input type="checkbox" class="chk-slot-photo" data-key="${slotKey}" ${isTicked ? 'checked' : ''}>
              ☑ Nạp Ảnh Test Vào Slot Này
            </label>
          </div>
          <div class="slot-actions">
            <button class="btn-sm btn-up" data-idx="${idx}">▲ Vẽ Trước</button>
            <button class="btn-sm btn-down" data-idx="${idx}">▼ Vẽ Sau (Đè Lên)</button>
            <button class="btn-sm btn-toggle-path" data-idx="${idx}">${hasClip ? 'Bỏ Path' : '+ Path Tim'}</button>
            <button class="btn-sm btn-del" data-idx="${idx}" style="color: #f43f5e;">Xóa</button>
          </div>
        `;
        slotList.appendChild(card);
      });

      // Bind slot photo checkboxes
      slotList.querySelectorAll('.chk-slot-photo').forEach(chk => {
        chk.onchange = (e) => {
          const sKey = e.target.dataset.key;
          slotPhotoTickedState[sKey] = e.target.checked;
          renderCanvas();
        };
      });

      // Bind inputs
      slotList.querySelectorAll('input[type="number"]').forEach(inp => {
        inp.oninput = (e) => {
          const idx = parseInt(e.target.dataset.idx);
          const key = e.target.dataset.key;
          currentSlots[idx][key] = floatVal(e.target.value);
          renderCanvas();
        };
      });

      // Bind order buttons
      slotList.querySelectorAll('.btn-up').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx);
          if (idx > 0) {
            const temp = currentSlots[idx];
            currentSlots[idx] = currentSlots[idx - 1];
            currentSlots[idx - 1] = temp;
            selectedSlotIdx = idx - 1;
            renderSidebar();
            renderCanvas();
          }
        };
      });

      slotList.querySelectorAll('.btn-down').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx);
          if (idx < currentSlots.length - 1) {
            const temp = currentSlots[idx];
            currentSlots[idx] = currentSlots[idx + 1];
            currentSlots[idx + 1] = temp;
            selectedSlotIdx = idx + 1;
            renderSidebar();
            renderCanvas();
          }
        };
      });

      slotList.querySelectorAll('.btn-toggle-path').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx);
          if (currentSlots[idx].clipPath) {
            delete currentSlots[idx].clipPath;
          } else {
            currentSlots[idx].clipPath = "M -89.5 -157.0 L -121.5 -138.0 L -124.5 -126.0 L -139.5 -113.0 L -149.5 -79.0 L -161.5 -66.0 L -156.5 -48.0 L -160.5 -4.0 L -151.5 9.0 L -153.5 22.0 L -86.5 105.0 L -68.5 110.0 L 21.5 109.0 L 19.5 149.0 L -15.5 151.0 L -0.5 153.0 L 13.5 165.0 L 31.5 165.0 L 44.5 153.0 L 84.5 139.0 L 93.5 126.0 L 110.5 118.0 L 114.5 107.0 L 134.5 103.0 L 142.5 87.0 L 159.5 73.0 L 160.5 65.0 L 126.5 23.0 L 128.5 9.0 L 119.5 -2.0 L 123.5 -48.0 L 118.5 -62.0 L 140.5 -103.0 L 141.5 -116.0 L 161.5 -142.0 L 101.5 -166.0 L 83.5 -158.0 L 67.5 -160.0 L 22.5 -131.0 L -26.5 -161.0 L -39.5 -158.0 L -58.5 -166.0 L -72.5 -157.0 Z";
          }
          renderSidebar();
          renderCanvas();
        };
      });

      slotList.querySelectorAll('.btn-del').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx);
          currentSlots.splice(idx, 1);
          selectedSlotIdx = Math.max(0, idx - 1);
          renderSidebar();
          renderCanvas();
        };
      });
    }

    function floatVal(v) { return parseFloat(v) || 0; }

    function renderCanvas() {
      const tmpl = ALL_TEMPLATES[currentTmplId];
      if (!tmpl) return;

      const overrideTmpl = {
        ...tmpl,
        slots: currentSlots
      };

      // Construct slot images array:
      // 1. If slot tick box is checked -> use test image
      // 2. Else if chkDemoPhotos is checked -> use demo image
      // 3. Else -> null (empty box)
      const slotDataArr = currentSlots.map((s, i) => {
        const sKey = s.id || ('slot_' + i);
        if (slotPhotoTickedState[sKey]) {
          const key = demoImageMap['test_local_photo'] ? 'test_local_photo' : ('test_img_' + (i % 4));
          return { imageId: key, zoom: 1.0, panX: 0, panY: 0, rotation: 0 };
        } else if (chkDemoPhotos.checked) {
          const key = demoImageMap['test_local_photo'] ? 'test_local_photo' : ('test_img_' + (i % 4));
          return { imageId: key, zoom: 1.0, panX: 0, panY: 0, rotation: 0 };
        }
        return null;
      });

      const state = {
        overrideTemplate: overrideTmpl,
        currentTemplate: currentTmplId,
        slots: slotDataArr,
        selectedSlotIndex: selectedSlotIdx,
        imageCache: demoImageMap,
        frameImageObj: chkShowPNG.checked ? frameImgObj : null,
        isPreview: true,
        currentStep: 3,
        targetWidth: tmpl.canvas_width
      };

      CanvasRenderer.drawToCanvas(canvas, state);

      // Scale to fit viewport
      const scale = canvas.width / tmpl.canvas_width;
      ctx.save();
      ctx.scale(scale, scale);

      // Draw PNG frame overlay with selected opacity
      const opacity = parseFloat(rngOpacity.value);
      if (chkShowPNG.checked && frameImgObj) {
        ctx.globalAlpha = opacity;
        ctx.drawImage(frameImgObj, 0, 0, tmpl.canvas_width, tmpl.canvas_height);
        ctx.globalAlpha = 1.0;
      }

      // Draw custom ClipPath Mask Outline if enabled
      if (chkShowMask.checked) {
        currentSlots.forEach((slot, idx) => {
          if (slot.clipPath) {
            ctx.save();
            ctx.translate(slot.cx, slot.cy);
            if (slot.rotation) ctx.rotate(slot.rotation * Math.PI / 180);
            
            const p = new Path2D(slot.clipPath);
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 5;
            ctx.setLineDash([8, 6]);
            ctx.stroke(p);
            ctx.setLineDash([]);
            ctx.restore();
          }
        });
      }

      // Draw interactive handles for selection
      currentSlots.forEach((slot, idx) => {
        const isSel = (idx === selectedSlotIdx);
        ctx.save();
        ctx.translate(slot.cx, slot.cy);
        if (slot.rotation) ctx.rotate(slot.rotation * Math.PI / 180);

        ctx.strokeStyle = isSel ? '#38bdf8' : 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = isSel ? 6 : 2;
        if (isSel) {
          ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';
          ctx.shadowBlur = 14;
        }
        ctx.strokeRect(-slot.w / 2, -slot.h / 2, slot.w, slot.h);
        ctx.shadowBlur = 0;

        // Slot Label Badge
        ctx.fillStyle = isSel ? '#38bdf8' : 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(-slot.w / 2, -slot.h / 2 - 32, 110, 28);
        ctx.fillStyle = isSel ? '#000000' : '#ffffff';
        ctx.font = 'bold 14px Inter, sans-serif';
        ctx.fillText(`Slot ${idx + 1}`, -slot.w / 2 + 10, -slot.h / 2 - 13);

        ctx.restore();
      });

      ctx.restore();
    }

    // Canvas Mouse Interactions
    canvas.onmousedown = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scale = ALL_TEMPLATES[currentTmplId].canvas_width / rect.width;
      const mouseX = (e.clientX - rect.left) * scale;
      const mouseY = (e.clientY - rect.top) * scale;

      for (let i = currentSlots.length - 1; i >= 0; i--) {
        const s = currentSlots[i];
        if (Math.abs(mouseX - s.cx) <= s.w / 2 && Math.abs(mouseY - s.cy) <= s.h / 2) {
          selectedSlotIdx = i;
          isDragging = true;
          dragStartPos = { x: mouseX, y: mouseY };
          initialSlotPos = { ...s };
          renderSidebar();
          renderCanvas();
          break;
        }
      }
    };

    window.onmousemove = (e) => {
      if (!isDragging || selectedSlotIdx < 0) return;
      const rect = canvas.getBoundingClientRect();
      const scale = ALL_TEMPLATES[currentTmplId].canvas_width / rect.width;
      const mouseX = (e.clientX - rect.left) * scale;
      const mouseY = (e.clientY - rect.top) * scale;

      const dx = Math.round(mouseX - dragStartPos.x);
      const dy = Math.round(mouseY - dragStartPos.y);

      currentSlots[selectedSlotIdx].cx = initialSlotPos.cx + dx;
      currentSlots[selectedSlotIdx].cy = initialSlotPos.cy + dy;

      renderSidebar();
      renderCanvas();
    };

    window.onmouseup = () => { isDragging = false; };

    selTemplate.onchange = () => loadTemplate(selTemplate.value);

    chkShowPNG.onchange = renderCanvas;
    chkShowMask.onchange = renderCanvas;
    chkDemoPhotos.onchange = renderCanvas;
    rngOpacity.oninput = (e) => {
      txtOpacity.innerText = Math.round(e.target.value * 100) + '%';
      renderCanvas();
    };

    btnSaveDirect.onclick = async () => {
      try {
        const res = await fetch('/api/admin/save-slots', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            templateId: currentTmplId,
            slots: currentSlots
          })
        });
        const data = await res.json();
        if (data.success) {
          alert(`✅ THÀNH CÔNG!\nĐã ghi trực tiếp toàn bộ thông số Slots của ${currentTmplId} vào mã nguồn pl-globals.js!`);
        } else {
          alert(`❌ Lỗi: ${data.error}`);
        }
      } catch (err) {
        alert(`❌ Lỗi kết nối Server: ${err.message}`);
      }
    };

    document.getElementById('btnAddSlot').onclick = () => {
      const tmpl = ALL_TEMPLATES[currentTmplId];
      currentSlots.push({
        id: `slot_${currentTmplId}_${currentSlots.length}`,
        color: '#ff3131',
        cx: tmpl.canvas_width / 2,
        cy: tmpl.canvas_height / 2,
        w: 400,
        h: 400,
        rotation: 0
      });
      selectedSlotIdx = currentSlots.length - 1;
      renderSidebar();
      renderCanvas();
    };

    const modal = document.getElementById('jsonModal');
    const jsonOutput = document.getElementById('jsonOutput');

    document.getElementById('btnExportJSON').onclick = () => {
      const output = JSON.stringify(currentSlots, null, 12);
      jsonOutput.value = `"slots": ${output}`;
      modal.style.display = 'flex';
    };

    document.getElementById('btnCloseModal').onclick = () => { modal.style.display = 'none'; };
    document.getElementById('btnCopyJSON').onclick = () => {
      jsonOutput.select();
      navigator.clipboard.writeText(jsonOutput.value);
      alert('Đã sao chép mã cấu hình JSON vào Clipboard thành công!');
    };

    loadTemplate('a5-1');
  </script>
</body>
</html>
