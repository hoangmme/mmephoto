<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MME Slot & Frame Visual Calibration Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(20, 26, 42, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-pink: #f43f5e;
      --accent-purple: #a855f7;
      --accent-green: #10b981;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 60px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }
    .brand span { color: var(--accent); }
    .controls-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select, button, input[type="text"], input[type="number"] {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    select:focus, button:hover, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }
    button.btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    button.btn-save {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    button.btn-save:hover, button.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .main-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .canvas-viewport {
      flex: 1;
      background: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }
    .view-toolbar {
      position: absolute;
      top: 16px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
      font-size: 13px;
    }
    .canvas-container {
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      border-radius: 4px;
      background: #ffffff;
      max-width: 100%;
      max-height: calc(100vh - 120px);
      object-fit: contain;
    }
    .sidebar {
      width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .slot-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slot-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      transition: all 0.2s;
    }
    .slot-card.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }
    .slot-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
    }
    .badge-index {
      background: var(--accent);
      color: #000;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .field-group label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .field-group input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 5px 8px;
    }
    .slot-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .json-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .json-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 800px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    textarea {
      flex: 1;
      min-height: 380px;
      background: #020617;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#38bdf8" stroke-width="2"/><path d="M12 6v12M6 12h12" stroke="#f43f5e" stroke-width="2"/></svg>
      MME Slot Editor <span>Visual Calibration</span>
    </div>
    <div class="controls-top">
      <label>Template:</label>
      <select id="selTemplate"></select>
      <button id="btnAddTemplate" class="btn-sm" style="background: #a855f7;">+ Thêm Mới</button>
      <button id="btnResetDraft" class="btn-sm" style="color: #f59e0b;">🔄 Reset Về Gốc (pl-globals.js)</button>
      <button id="btnAddSlot" class="btn-sm">+ Thêm Slot</button>
      <button id="btnSaveDirect" class="btn-save">💾 LƯU TRỰC TIẾP VÀO CODE</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="canvas-viewport" id="viewport">
      <div class="view-toolbar">
        <label style="display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" id="chkShowPNG" checked> Lớp PNG Frame
        </label>
        <label style="display: flex; align-items: center; gap: 6px;">
          PNG Opacity:
          <input type="range" id="rngOpacity" min="0" max="1" step="0.05" value="1" style="width: 80px;">
          <span id="txtOpacity">100%</span>
        </label>
        <label style="display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" id="chkShowMask" checked> Hiển thị ClipPath Mask
        </label>
        <label style="display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" id="chkDemoPhotos"> Nạp Ảnh Demo Tất Cả
        </label>
      </div>

      <div class="canvas-container">
        <canvas id="editorCanvas"></canvas>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header" style="background: #1e293b; padding: 12px; border-bottom: 1px solid #334155; margin-bottom: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 8px;">
        <div class="field-group">
          <label>Tên Template (Hiển thị UI)</label>
          <input type="text" id="txtTmplName" placeholder="VD: Khung 4 Ảnh" style="width: 100%;">
        </div>
        <div class="field-group">
          <label>Đường dẫn Ảnh Nền (frame_url)</label>
          <div style="display:flex; gap:6px;">
            <input type="text" id="txtTmplFrameUrl" placeholder="VD: templates/a4-1.png" style="flex:1;">
            <input type="file" id="fileFrameUpload" style="display:none;" accept="image/png, image/jpeg, image/webp">
            <button id="btnUploadFrame" class="btn-sm" style="background:#22c55e;">Tải PNG</button>
          </div>
        </div>
        <div class="field-group">
          <label>Chi nhánh áp dụng (Để trống = Tất cả)</label>
          <div id="branchCheckboxes" style="display:flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: 12px;">
            <span style="color: #94a3b8;">Đang tải...</span>
          </div>
        </div>
        <div class="field-group">
          <label>Loại giấy (Hiển thị tab riêng)</label>
          <div id="tagCheckboxes" style="display:flex; gap: 12px; margin-top: 4px; font-size: 13px; color: #38bdf8;">
            <label style="cursor:pointer;"><input type="checkbox" value="a4" class="chk-tmpl-tag"> 📄 A4</label>
            <label style="cursor:pointer;"><input type="checkbox" value="a5" class="chk-tmpl-tag"> 📄 A5</label>
          </div>
        </div>
      </div>
      <div class="sidebar-header">
        <span>Danh sách Slots (Thứ Tự Vẽ: Trên → Dưới)</span>
      </div>
      <div class="slot-list" id="slotList"></div>
    </div>
  </div>

  <script type="module">
    import { ALL_TEMPLATES } from './js/modules/pl-globals.js?v=297';
    import { CanvasRenderer } from './js/components/CanvasRenderer.js?v=297';

    let currentTmplId = 'a5-1';
    let currentSlots = [];
    let selectedSlotIdx = 0;
    let isDragging = false;

    const CLIP_PATHS = {
      "heart": "M -89.5 -157.0 L -121.5 -138.0 L -124.5 -126.0 L -139.5 -113.0 L -149.5 -79.0 L -161.5 -66.0 L -156.5 -48.0 L -160.5 -4.0 L -151.5 9.0 L -153.5 22.0 L -86.5 105.0 L -68.5 110.0 L 21.5 109.0 L 19.5 149.0 L -15.5 151.0 L -0.5 153.0 L 13.5 165.0 L 31.5 165.0 L 44.5 153.0 L 84.5 139.0 L 93.5 126.0 L 110.5 118.0 L 114.5 107.0 L 134.5 103.0 L 142.5 87.0 L 159.5 73.0 L 160.5 65.0 L 126.5 23.0 L 128.5 9.0 L 119.5 -2.0 L 123.5 -48.0 L 118.5 -62.0 L 140.5 -103.0 L 141.5 -116.0 L 161.5 -142.0 L 101.5 -166.0 L 83.5 -158.0 L 67.5 -160.0 L 22.5 -131.0 L -26.5 -161.0 L -39.5 -158.0 L -58.5 -166.0 L -72.5 -157.0 Z",
      "path2": "M 0.0664062 -1.667969 L 91.109375 -1.667969 L 91.109375 81.398438 L 0.0664062 81.398438 Z M 0.0664062 -1.667969"
    };

    let dragStartPos = { x: 0, y: 0 };
    let initialSlotPos = { cx: 0, cy: 0, w: 0, h: 0 };
    let frameImgObj = null;
    let demoImageMap = {};


    const selTemplate = document.getElementById('selTemplate');
    const slotList = document.getElementById('slotList');
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    const chkShowPNG = document.getElementById('chkShowPNG');
    const rngOpacity = document.getElementById('rngOpacity');
    const txtOpacity = document.getElementById('txtOpacity');
    const chkShowMask = document.getElementById('chkShowMask');
    const chkDemoPhotos = document.getElementById('chkDemoPhotos');
    const btnSaveDirect = document.getElementById('btnSaveDirect');

    // Populate dropdown
    Object.keys(ALL_TEMPLATES).forEach(id => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = ALL_TEMPLATES[id].name ? ALL_TEMPLATES[id].name : id;
      selTemplate.appendChild(opt);
    });

    // Helper: Create instant dataURL test image with vibrant patterns & clear label
    function createInstantTestPhoto(bgColor, labelText) {
      const pc = document.createElement('canvas');
      pc.width = 1200; pc.height = 1200;
      const pctx = pc.getContext('2d');
      
      // Gradient background
      const grad = pctx.createLinearGradient(0, 0, 1200, 1200);
      grad.addColorStop(0, bgColor);
      grad.addColorStop(1, '#090d16');
      pctx.fillStyle = grad;
      pctx.fillRect(0, 0, 1200, 1200);

      // Inner portrait border simulation
      pctx.strokeStyle = '#ffffff';
      pctx.lineWidth = 16;
      pctx.strokeRect(60, 60, 1080, 1080);

      // Text label
      pctx.fillStyle = '#ffffff';
      pctx.font = 'bold 80px Inter, sans-serif';
      pctx.textAlign = 'center';
      pctx.textBaseline = 'middle';
      pctx.fillText(labelText, 600, 600);

      const img = new Image();
      img.src = pc.toDataURL('image/png');
      return img;
    }

    // Pre-create instant test images (Zero network delay, 100% reliable)
    const testImgRed = createInstantTestPhoto('#e11d48', 'TEST PHOTO 1');
    const testImgGreen = createInstantTestPhoto('#059669', 'TEST PHOTO 2');
    const testImgBlue = createInstantTestPhoto('#2563eb', 'TEST PHOTO 3');
    const testImgPurple = createInstantTestPhoto('#9333ea', 'TEST PHOTO 4');

    demoImageMap = {
      'test_img_0': testImgRed,
      'test_img_1': testImgGreen,
      'test_img_2': testImgBlue,
      'test_img_3': testImgPurple
    };

    // Load local test_photo.jpg (Downloaded to local disk for 100% fast & reliable loading)
    const testLocalImg = new Image();
    testLocalImg.src = './templates/test_photo.jpg';
    testLocalImg.onload = () => {
      demoImageMap['test_local_photo'] = testLocalImg;
      renderCanvas();
    };

    async function loadTemplate(tmplId, forceReset = false) {
      currentTmplId = tmplId;
      if (selTemplate.value !== tmplId) {
        selTemplate.value = tmplId;
      }
      const tmpl = ALL_TEMPLATES[tmplId];
      if (!tmpl) return;

      if (forceReset) {
        localStorage.removeItem(`mme_slot_draft_${tmplId}`);
      }

      const localDraft = localStorage.getItem(`mme_slot_draft_${tmplId}`);
      if (localDraft && !forceReset) {
        try {
          currentSlots = JSON.parse(localDraft);
        } catch (e) {
          currentSlots = JSON.parse(JSON.stringify(tmpl.slots || []));
        }
      } else {
        currentSlots = JSON.parse(JSON.stringify(tmpl.slots || []));
      }

      // Sync rotation from pl-globals.js if missing
      currentSlots.forEach((slot, idx) => {
        if (tmpl.slots && tmpl.slots[idx] && slot.rotation === undefined) {
          slot.rotation = tmpl.slots[idx].rotation || 0;
        }
      });

      selectedSlotIdx = 0;


      frameImgObj = new Image();
      frameImgObj.src = tmpl.frame_url;
      if (!frameImgObj.complete) {
        await new Promise(r => {
          frameImgObj.onload = r;
          frameImgObj.onerror = r;
        });
      }

      document.getElementById('txtTmplName').value = tmpl.name || '';
      document.getElementById('txtTmplFrameUrl').value = tmpl.frame_url || '';
      
      document.querySelectorAll('.chk-tmpl-branch').forEach(chk => {
        chk.checked = tmpl.branches && tmpl.branches.includes(chk.value);
      });
      const fallbackInput = document.getElementById('txtTmplBranchesFallback');
      if (fallbackInput) {
        fallbackInput.value = (tmpl.branches || []).join(', ');
      }
      document.querySelectorAll('.chk-tmpl-tag').forEach(chk => {
        chk.checked = tmpl.tags && tmpl.tags.includes(chk.value);
      });

      renderSidebar();
      renderCanvas();
    }

    function renderSidebar() {
      slotList.innerHTML = '';
      currentSlots.forEach((slot, idx) => {
        const card = document.createElement('div');
        card.className = `slot-card ${idx === selectedSlotIdx ? 'active' : ''}`;
        card.onclick = (e) => {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'OPTION' && !e.target.classList.contains('chk-slot-photo')) {
            selectedSlotIdx = idx;
            renderSidebar();
            renderCanvas();
          }
        };

        const hasClip = !!slot.clipPath;
        const slotKey = slot.id || ('slot_' + idx);


        card.innerHTML = `
          <div class="slot-card-header">
            <span><span class="badge-index">${idx + 1}</span> ${slotKey}</span>
            <span style="font-size: 11px; color: ${hasClip ? '#38bdf8' : '#94a3b8'};">${hasClip ? '★ ClipPath Mask' : 'Rect Slot'}</span>
          </div>
          <div class="grid-2x2">
            <div class="field-group"><label>CX (X Center)</label><input type="number" value="${slot.cx}" data-key="cx" data-idx="${idx}"></div>
            <div class="field-group"><label>CY (Y Center)</label><input type="number" value="${slot.cy}" data-key="cy" data-idx="${idx}"></div>
            <div class="field-group"><label>Width (W)</label><input type="number" value="${slot.w}" data-key="w" data-idx="${idx}"></div>
            <div class="field-group"><label>Height (H)</label><input type="number" value="${slot.h}" data-key="h" data-idx="${idx}"></div>
            <div class="field-group" style="grid-column: span 2;"><label>Góc Xoay Mặc Định (Rotation °)</label><input type="number" value="${slot.rotation || 0}" data-key="rotation" data-idx="${idx}" placeholder="0, 90, -90, 180"></div>
          </div>
          <div class="slot-actions" style="margin-top: 12px;">
            <button class="btn-sm btn-up" data-idx="${idx}">▲ Vẽ Trước</button>
            <button class="btn-sm btn-down" data-idx="${idx}">▼ Vẽ Sau (Đè Lên)</button>
            <button class="btn-sm btn-rot-left" data-idx="${idx}">🔄 Xoay Trái (-90°)</button>
            <button class="btn-sm btn-rot-right" data-idx="${idx}">🔄 Xoay Phải (+90°)</button>
            
            <select class="sel-path" data-idx="${idx}" style="font-size: 11px; padding: 2px 4px; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 4px;">
              <option value="">+ Không có Path (Mặc định)</option>
              <option value="heart" ${slot.clipPath === CLIP_PATHS.heart ? 'selected' : ''}>+ Path: Trái Tim</option>
              <option value="path2" ${slot.clipPath === CLIP_PATHS.path2 ? 'selected' : ''}>+ Path 2 (Rect)</option>
              ${slot.clipPath && slot.clipPath !== CLIP_PATHS.heart && slot.clipPath !== CLIP_PATHS.path2 ? '<option value="custom" selected>+ Path: Tùy Chỉnh (Custom)</option>' : ''}
            </select>
            
            <button class="btn-sm btn-del" data-idx="${idx}" style="color: #f43f5e;">Xóa</button>
          </div>
        `;
        slotList.appendChild(card);
      });

      // Bind inputs
      slotList.querySelectorAll('input[type="number"]').forEach(inp => {
        inp.oninput = (e) => {
          const idx = parseInt(e.target.dataset.idx);
          const key = e.target.dataset.key;
          currentSlots[idx][key] = floatVal(e.target.value);
          renderCanvas();
        };
      });

      // Bind order buttons
      slotList.querySelectorAll('.btn-up').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx);
          if (idx > 0) {
            const temp = currentSlots[idx];
            currentSlots[idx] = currentSlots[idx - 1];
            currentSlots[idx - 1] = temp;
            selectedSlotIdx = idx - 1;
            renderSidebar();
            renderCanvas();
          }
        };
      });

      slotList.querySelectorAll('.btn-down').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx);
          if (idx < currentSlots.length - 1) {
            const temp = currentSlots[idx];
            currentSlots[idx] = currentSlots[idx + 1];
            currentSlots[idx + 1] = temp;
            selectedSlotIdx = idx + 1;
            renderSidebar();
            renderCanvas();
          }
        };
      });
      slotList.querySelectorAll('.btn-rot-left').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx);
          const currentRot = currentSlots[idx].rotation || 0;
          currentSlots[idx].rotation = (currentRot - 90) % 360;
          renderSidebar();
          renderCanvas();
        };
      });

      slotList.querySelectorAll('.btn-rot-right').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx);
          const currentRot = currentSlots[idx].rotation || 0;
          currentSlots[idx].rotation = (currentRot + 90) % 360;
          renderSidebar();
          renderCanvas();
        };
      });

      slotList.querySelectorAll('.sel-path').forEach(sel => {
        sel.onchange = (e) => {
          const idx = parseInt(e.target.dataset.idx);
          const val = e.target.value;
          if (!val) {
            delete currentSlots[idx].clipPath;
          } else if (val === 'heart') {
            currentSlots[idx].clipPath = CLIP_PATHS.heart;
          } else if (val === 'path2') {
            currentSlots[idx].clipPath = CLIP_PATHS.path2;
          }
          // if 'custom', we leave it alone (they can't select custom manually anyway, it's just for display if it already has one)
          renderSidebar();
          renderCanvas();
        };
      });

      slotList.querySelectorAll('.btn-del').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx);
          currentSlots.splice(idx, 1);
          selectedSlotIdx = Math.max(0, idx - 1);
          renderSidebar();
          renderCanvas();
        };
      });
    }

    function floatVal(v) { return parseFloat(v) || 0; }

    function renderCanvas() {
      const tmpl = ALL_TEMPLATES[currentTmplId];
      if (!tmpl) return;

      const overrideTmpl = {
        ...tmpl,
        slots: currentSlots
      };

      // Construct slot images array:
      // If chkDemoPhotos is checked -> use demo image
      // Else -> null (empty box)
      const slotDataArr = currentSlots.map((s, i) => {
        const defRot = s.defaultRotation !== undefined ? s.defaultRotation : (s.rotation || 0);
        if (chkDemoPhotos.checked) {
          const key = demoImageMap['test_local_photo'] ? 'test_local_photo' : ('test_img_' + (i % 4));
          return { imageId: key, zoom: 1.0, panX: 0, panY: 0, rotation: defRot };
        }
        return null;
      });

      const state = {
        overrideTemplate: overrideTmpl,
        currentTemplate: currentTmplId,
        slots: slotDataArr,
        selectedSlotIndex: selectedSlotIdx,
        imageCache: demoImageMap,
        frameImageObj: chkShowPNG.checked ? frameImgObj : null,
        isPreview: true,
        currentStep: 3,
        targetWidth: tmpl.canvas_width
      };

      CanvasRenderer.drawToCanvas(canvas, state);

      // Scale to fit viewport
      const scale = canvas.width / tmpl.canvas_width;
      ctx.save();
      ctx.scale(scale, scale);

      // Draw PNG frame overlay with selected opacity
      const opacity = parseFloat(rngOpacity.value);
      if (chkShowPNG.checked && frameImgObj) {
        ctx.globalAlpha = opacity;
        ctx.drawImage(frameImgObj, 0, 0, tmpl.canvas_width, tmpl.canvas_height);
        ctx.globalAlpha = 1.0;
      }

      // Draw custom ClipPath Mask Outline if enabled
      if (chkShowMask.checked) {
        currentSlots.forEach((slot, idx) => {
          if (slot.clipPath) {
            ctx.save();
            ctx.translate(slot.cx, slot.cy);
            if (slot.rotation) ctx.rotate(slot.rotation * Math.PI / 180);
            
            const p = new Path2D(slot.clipPath);
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 5;
            ctx.setLineDash([8, 6]);
            ctx.stroke(p);
            ctx.setLineDash([]);
            ctx.restore();
          }
        });
      }

      // Draw interactive handles for selection & resize
      currentSlots.forEach((slot, idx) => {
        const isSel = (idx === selectedSlotIdx);
        ctx.save();
        ctx.translate(slot.cx, slot.cy);
        if (slot.rotation) ctx.rotate(slot.rotation * Math.PI / 180);

        ctx.strokeStyle = isSel ? '#38bdf8' : 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = isSel ? 6 : 2;
        if (isSel) {
          ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';
          ctx.shadowBlur = 14;
        }
        ctx.strokeRect(-slot.w / 2, -slot.h / 2, slot.w, slot.h);
        ctx.shadowBlur = 0;

        // Slot Label Badge
        ctx.fillStyle = isSel ? '#38bdf8' : 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(-slot.w / 2, -slot.h / 2 - 32, 110, 28);
        ctx.fillStyle = isSel ? '#000000' : '#ffffff';
        ctx.font = 'bold 14px Inter, sans-serif';
        ctx.fillText(`Slot ${idx + 1}`, -slot.w / 2 + 10, -slot.h / 2 - 13);

        // Draw 8 Interactive Resize Handles if selected
        if (isSel) {
          const hw = slot.w / 2;
          const hh = slot.h / 2;
          const handlePts = [
            { x: -hw, y: -hh }, // Top-Left
            { x:  hw, y: -hh }, // Top-Right
            { x: -hw, y:  hh }, // Bottom-Left
            { x:  hw, y:  hh }, // Bottom-Right
            { x:   0, y: -hh }, // Top
            { x:   0, y:  hh }, // Bottom
            { x: -hw, y:   0 }, // Left
            { x:  hw, y:   0 }  // Right
          ];

          handlePts.forEach(pt => {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
        }

        ctx.restore();
      });

      ctx.restore();
    }

    // Helper: Get handle at mouse canvas position for the selected slot
    function getHandleAtMouse(mouseX, mouseY, slot) {
      if (!slot) return null;
      const hitRadius = 24;
      const hw = slot.w / 2;
      const hh = slot.h / 2;

      const handles = [
        { name: 'tl', x: slot.cx - hw, y: slot.cy - hh, cursor: 'nwse-resize' },
        { name: 'tr', x: slot.cx + hw, y: slot.cy - hh, cursor: 'nesw-resize' },
        { name: 'bl', x: slot.cx - hw, y: slot.cy + hh, cursor: 'nesw-resize' },
        { name: 'br', x: slot.cx + hw, y: slot.cy + hh, cursor: 'nwse-resize' },
        { name: 't',  x: slot.cx,      y: slot.cy - hh, cursor: 'ns-resize' },
        { name: 'b',  x: slot.cx,      y: slot.cy + hh, cursor: 'ns-resize' },
        { name: 'l',  x: slot.cx - hw, y: slot.cy,      cursor: 'ew-resize' },
        { name: 'r',  x: slot.cx + hw, y: slot.cy,      cursor: 'ew-resize' }
      ];

      for (const h of handles) {
        if (Math.abs(mouseX - h.x) <= hitRadius && Math.abs(mouseY - h.y) <= hitRadius) {
          return h;
        }
      }
      return null;
    }

    let dragMode = 'none'; // 'none', 'move', 'resize'
    let activeResizeHandle = null;

    // Canvas Mouse Interactions
    canvas.onmousedown = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scale = ALL_TEMPLATES[currentTmplId].canvas_width / rect.width;
      const mouseX = (e.clientX - rect.left) * scale;
      const mouseY = (e.clientY - rect.top) * scale;

      // 1. Check if clicking on a resize handle of the currently selected slot
      if (selectedSlotIdx >= 0 && currentSlots[selectedSlotIdx]) {
        const handle = getHandleAtMouse(mouseX, mouseY, currentSlots[selectedSlotIdx]);
        if (handle) {
          dragMode = 'resize';
          activeResizeHandle = handle;
          isDragging = true;
          dragStartPos = { x: mouseX, y: mouseY };
          initialSlotPos = { ...currentSlots[selectedSlotIdx] };
          return;
        }
      }

      // 2. Check if clicking inside any slot to move/select
      for (let i = currentSlots.length - 1; i >= 0; i--) {
        const s = currentSlots[i];
        if (Math.abs(mouseX - s.cx) <= s.w / 2 && Math.abs(mouseY - s.cy) <= s.h / 2) {
          selectedSlotIdx = i;
          dragMode = 'move';
          isDragging = true;
          dragStartPos = { x: mouseX, y: mouseY };
          initialSlotPos = { ...s };
          renderSidebar();
          renderCanvas();
          return;
        }
      }
    };

    window.onmousemove = (e) => {
      const rect = canvas.getBoundingClientRect();
      const scale = ALL_TEMPLATES[currentTmplId].canvas_width / rect.width;
      const mouseX = (e.clientX - rect.left) * scale;
      const mouseY = (e.clientY - rect.top) * scale;

      // Update Cursor on hover when not dragging
      if (!isDragging && selectedSlotIdx >= 0 && currentSlots[selectedSlotIdx]) {
        const handle = getHandleAtMouse(mouseX, mouseY, currentSlots[selectedSlotIdx]);
        if (handle) {
          canvas.style.cursor = handle.cursor;
        } else {
          const s = currentSlots[selectedSlotIdx];
          if (Math.abs(mouseX - s.cx) <= s.w / 2 && Math.abs(mouseY - s.cy) <= s.h / 2) {
            canvas.style.cursor = 'move';
          } else {
            canvas.style.cursor = 'default';
          }
        }
      }

      if (!isDragging || selectedSlotIdx < 0) return;

      const dx = Math.round(mouseX - dragStartPos.x);
      const dy = Math.round(mouseY - dragStartPos.y);
      const s = currentSlots[selectedSlotIdx];

      if (dragMode === 'move') {
        s.cx = initialSlotPos.cx + dx;
        s.cy = initialSlotPos.cy + dy;
      } else if (dragMode === 'resize' && activeResizeHandle) {
        const hName = activeResizeHandle.name;
        const init = initialSlotPos;

        if (hName.includes('r')) {
          s.w = Math.max(50, Math.round(init.w + dx));
          s.cx = Math.round(init.cx + (s.w - init.w) / 2);
        } else if (hName.includes('l')) {
          s.w = Math.max(50, Math.round(init.w - dx));
          s.cx = Math.round(init.cx - (s.w - init.w) / 2);
        }

        if (hName.includes('b')) {
          s.h = Math.max(50, Math.round(init.h + dy));
          s.cy = Math.round(init.cy + (s.h - init.h) / 2);
        } else if (hName.includes('t')) {
          s.h = Math.max(50, Math.round(init.h - dy));
          s.cy = Math.round(init.cy - (s.h - init.h) / 2);
        }
      }

      renderSidebar();
      renderCanvas();
    };

    window.onmouseup = () => {
      isDragging = false;
      dragMode = 'none';
      activeResizeHandle = null;
    };

    selTemplate.onchange = () => loadTemplate(selTemplate.value);
    
    document.getElementById('txtTmplFrameUrl').onchange = (e) => {
      const url = e.target.value.trim();
      if (url) {
        frameImgObj.src = url;
        frameImgObj.onload = renderCanvas;
        frameImgObj.onerror = renderCanvas;
      }
    };

    const fileFrameUpload = document.getElementById('fileFrameUpload');
    document.getElementById('btnUploadFrame').onclick = () => fileFrameUpload.click();
    fileFrameUpload.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('frame', file);
      
      const btn = document.getElementById('btnUploadFrame');
      const oldText = btn.textContent;
      btn.textContent = 'Đang tải...';
      
      try {
        const res = await fetch('/api/admin/upload-frame', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          const txtUrl = document.getElementById('txtTmplFrameUrl');
          txtUrl.value = data.url;
          txtUrl.dispatchEvent(new Event('change'));
        } else {
          alert('Lỗi: ' + data.error);
        }
      } catch (err) {
        alert('Lỗi mạng khi tải ảnh lên!');
      } finally {
        btn.textContent = oldText;
        fileFrameUpload.value = '';
      }
    };

    chkShowPNG.onchange = renderCanvas;
    chkShowMask.onchange = renderCanvas;
    chkDemoPhotos.onchange = renderCanvas;
    rngOpacity.oninput = (e) => {
      txtOpacity.innerText = Math.round(e.target.value * 100) + '%';
      renderCanvas();
    };

    document.getElementById('btnResetDraft').onclick = () => {
      if (confirm(`Bạn có chắc chắn muốn xóa bản nháp và Reset toàn bộ khung của ${currentTmplId} về dữ liệu gốc từ pl-globals.js không?`)) {
        loadTemplate(currentTmplId, true);
      }
    };

    btnSaveDirect.onclick = async () => {
      try {
        localStorage.setItem(`mme_slot_draft_${currentTmplId}`, JSON.stringify(currentSlots));
        
        const tmplName = document.getElementById('txtTmplName').value.trim();
        const frameUrl = document.getElementById('txtTmplFrameUrl').value.trim();
        let branchesArr = Array.from(document.querySelectorAll('.chk-tmpl-branch:checked')).map(c => c.value);
        
        const fallbackInput = document.getElementById('txtTmplBranchesFallback');
        if (fallbackInput) {
          const branchesStr = fallbackInput.value.trim();
          branchesArr = branchesStr ? branchesStr.split(',').map(s => s.trim()).filter(s => s) : [];
        }

        const tagsArr = Array.from(document.querySelectorAll('.chk-tmpl-tag:checked')).map(c => c.value);

        // Update the template in memory
        ALL_TEMPLATES[currentTmplId].name = tmplName || currentTmplId;
        if (frameUrl) ALL_TEMPLATES[currentTmplId].frame_url = frameUrl;
        ALL_TEMPLATES[currentTmplId].branches = branchesArr.length > 0 ? branchesArr : undefined;
        ALL_TEMPLATES[currentTmplId].tags = tagsArr.length > 0 ? tagsArr : undefined;
        
        if (!ALL_TEMPLATES[currentTmplId].branches) delete ALL_TEMPLATES[currentTmplId].branches;
        if (!ALL_TEMPLATES[currentTmplId].tags) delete ALL_TEMPLATES[currentTmplId].tags;
        ALL_TEMPLATES[currentTmplId].slots = currentSlots;

        const endpoints = [
          '/api/admin/save-slots',
          'http://localhost:3000/api/admin/save-slots',
          'http://127.0.0.1:3000/api/admin/save-slots',
          'http://localhost:8080/api/admin/save-slots'
        ];

        let savedData = null;

        for (const ep of endpoints) {
          try {
            const res = await fetch(ep, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                templateId: currentTmplId,
                templateData: ALL_TEMPLATES[currentTmplId]
              })
            });
            const cType = res.headers.get('content-type') || '';
            if (res.ok && cType.includes('application/json')) {
              const data = await res.json();
              if (data.success) {
                savedData = data;
                break;
              }
            }
          } catch (e) {
            // Try next endpoint
          }
        }

        if (savedData && savedData.success) {
          alert(`✅ ĐÃ LƯU THÀNH CÔNG VÀO FILE PL-GLOBALS.JS!`);
        } else {
          alert(`❌ Lỗi kết nối Server Node.js (404 Not Found)!\n\nHãy đảm bảo bạn đã chạy server Node.js bằng cách gõ lệnh sau trong Terminal trên máy bạn:\n\n   npm run editor\n\n(Hoặc lệnh: node server.js)`);
        }
      } catch (err) {
        alert(`❌ Lỗi: ${err.message}`);
      }
    };

    document.getElementById('btnAddSlot').onclick = () => {
      const tmpl = ALL_TEMPLATES[currentTmplId];
      currentSlots.push({
        id: `slot_${currentTmplId}_${currentSlots.length}`,
        color: '#ff3131',
        cx: tmpl.canvas_width / 2,
        cy: tmpl.canvas_height / 2,
        w: 400,
        h: 400,
        rotation: 0
      });
      selectedSlotIdx = currentSlots.length - 1;
      renderSidebar();
      renderCanvas();
    };

    document.getElementById('btnAddTemplate').onclick = () => {
      const id = prompt('Nhập ID cho Template mới (VD: 4photo_new):');
      if (!id) return;
      if (ALL_TEMPLATES[id]) {
        alert('Template ID này đã tồn tại!');
        return;
      }
      
      const w = parseInt(prompt('Nhập chiều rộng (Width) theo pixel:', '1200'));
      const h = parseInt(prompt('Nhập chiều cao (Height) theo pixel:', '1800'));
      if (isNaN(w) || isNaN(h)) return;
      
      ALL_TEMPLATES[id] = {
        canvas_width: w,
        canvas_height: h,
        slots: []
      };
      
      const selTemplate = document.getElementById('selTemplate');
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = `${id} (${w}x${h}) [Local]`;
      selTemplate.appendChild(opt);
      selTemplate.value = id;
      
      loadTemplate(id);
    };

    // Load branches from live server then init template
    fetch('https://photo.llphotobooth.vn/api/branches')
      .then(res => {
        if (!res.ok) throw new Error('API not available');
        return res.json();
      })
      .then(data => {
        const c = document.getElementById('branchCheckboxes');
        c.innerHTML = '';
        if (data && data.branches && Array.isArray(data.branches)) {
          data.branches.forEach(b => {
            c.innerHTML += `<label style="cursor:pointer;"><input type="checkbox" value="${b}" class="chk-tmpl-branch"> ${b}</label>`;
          });
        } else if (data && data.branches) {
           Object.keys(data.branches).forEach(b => {
             c.innerHTML += `<label style="cursor:pointer;"><input type="checkbox" value="${b}" class="chk-tmpl-branch"> ${b}</label>`;
           });
        }
      })
      .catch(e => {
        // Fallback to text input if API fails (e.g. running on live server without updated backend)
        const c = document.getElementById('branchCheckboxes');
        c.innerHTML = `<input type="text" id="txtTmplBranchesFallback" placeholder="VD: CN01, CN02 (API lỗi)" style="width: 100%; font-size: 11px; padding: 4px;">`;
      })
      .finally(() => {
        loadTemplate('a5-1');
      });


  </script>
</body>
