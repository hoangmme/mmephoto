<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MME Color Lab — Redirecting...</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var u = (params.get('user') || params.get('role') || params.get('mode') || '').toLowerCase();
      var isStaff = (u === 'staff' || u === 'admin' || params.has('staff'));

      // Preserve all other query params (batch, etc.) when redirecting
      var targetPage = isStaff ? 'staff.html' : 'user.html';
      var newParams = new URLSearchParams(params);
      // Remove role-detection params since they're no longer needed
      newParams.delete('user');
      newParams.delete('role');
      newParams.delete('mode');
      newParams.delete('staff');

      var qs = newParams.toString();
      var target = targetPage + (qs ? '?' + qs : '');
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 40px; color: #888;">Đang chuyển hướng...</p>
</body>
</html>
